<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day 🌹</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff0f5, #ffe4ec);
  font-family: 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #c94a6a;
}

.container {
  padding: 28px 22px;
  max-width: 360px;
}

.rose {
  font-size: 64px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-size: 2rem;
  margin: 16px 0 12px;
}

p {
  font-size: 1.05rem;
  line-height: 1.7;
  margin: 10px 0;
}

button {
  margin-top: 22px;
  padding: 14px 28px;
  border: none;
  border-radius: 999px;
  background: #ff7fa1;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255,127,161,0.35);
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

button:active {
  transform: scale(0.94);
}

button:hover {
  background: #ff5f8f;
  box-shadow: 0 14px 30px rgba(255,95,143,0.45);
}

.card {
  display: none;
  background: white;
  margin-top: 26px;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.08);
  animation: fadeUp 0.6s ease forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart {
  position: absolute;
  font-size: 18px;
  animation: rise 4s linear infinite;
  opacity: 0.8;
}

@keyframes rise {
  from {
    transform: translateY(100vh) scale(0.8);
    opacity: 0;
  }
  to {
    transform: translateY(-10vh) scale(1.3);
    opacity: 1;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="rose">🌹</div>
  <h1>Happy Rose Day dumbo 🐘</h1>

  <p>
    I know this rose isn’t in my hands right now,<br>
    but it’s still meant only for you 💕
  </p>

  <button onclick="reveal()">Tap here dumbo 💗</button>

  <div class="card" id="message">
    <p>
      I love you jaanu.<br>
      I love your pretty smile.<br>
      With you everything feels okay.<br><br>
      You make my life worth living 💖
    </p>
  </div>
</div>

<div class="hearts" id="hearts"></div>

<script>
function reveal() {
  document.getElementById('message').style.display = 'block';
  for (let i = 0; i < 18; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '💗';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDelay = Math.random() * 2 + 's';
    document.getElementById('hearts').appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }
}
</script>
</body>
</html>
