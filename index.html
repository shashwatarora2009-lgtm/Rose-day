<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Rose Day 🌹</title>

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', system-ui, sans-serif;
  background: linear-gradient(180deg, #fff1f4, #ffe4ea);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #c94a6a;
  overflow-x: hidden;
}

/* ===== CONTAINER ===== */
.container {
  width: 100%;
  max-width: 420px;
  padding: 28px 22px 40px;
  text-align: center;
  position: relative;
}

/* ===== FLOATING HEARTS ===== */
.heart {
  position: fixed;
  font-size: 18px;
  animation: floatUp 10s linear infinite;
  opacity: 0.35;
}

@keyframes floatUp {
  from { transform: translateY(100vh); }
  to { transform: translateY(-120px); }
}

/* ===== HERO ===== */
.rose {
  font-size: 64px;
  animation: gentleFloat 3s ease-in-out infinite;
}

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-size: 2rem;
  margin: 14px 0 8px;
}

.subtitle {
  font-size: 1.05rem;
  line-height: 1.6;
  margin-bottom: 22px;
}

/* ===== BUTTON ===== */
button {
  border: none;
  background: #ff6f91;
  color: white;
  padding: 14px 28px;
  border-radius: 999px;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(255, 111, 145, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:active {
  transform: scale(0.94);
  box-shadow: 0 6px 18px rgba(255, 111, 145, 0.35);
}

/* ===== CARDS ===== */
.card {
  background: white;
  border-radius: 24px;
  padding: 26px 22px;
  margin-top: 26px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
  display: none;
  animation: fadeUp 0.6s ease forwards;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card p {
  font-size: 1.05rem;
  line-height: 1.75;
  margin: 0;
}

/* ===== FINAL TEXT ===== */
.end {
  margin-top: 30px;
  font-size: 0.95rem;
  opacity: 0.7;
}

/* ===== SMALL SCREEN TWEAK ===== */
@media (max-width: 360px) {
  h1 { font-size: 1.8rem; }
  .subtitle { font-size: 1rem; }
}
</style>
</head>

<body>

<div class="container">

  <div class="rose">🌹</div>

  <h1>Happy Rose Day dumbo 💗</h1>

  <div class="subtitle">
    I love you.  
    I miss you.  
    This rose is for you.
  </div>

  <button id="mainBtn">Tap here dumbo</button>

  <div class="card" id="card1">
    <p>
      I love you jaanu.  
      I love your pretty smile.  
      With you everything feels okay.
    </p>
  </div>

  <div class="card" id="card2">
    <p>
      You make my life worth living 💖
    </p>
  </div>

  <div class="end" id="endText">
    always yours 🌸
  </div>

</div>

<script>
/* ===== BUTTON INTERACTION ===== */
let step = 0;
const btn = document.getElementById('mainBtn');
const card1 = document.getElementById('card1');
const card2 = document.getElementById('card2');
const endText = document.getElementById('endText');

btn.addEventListener('click', () => {
  step++;

  if (step === 1) {
    card1.style.display = 'block';
    btn.innerText = 'Tap again 👀';
  } 
  else if (step === 2) {
    card2.style.display = 'block';
    btn.innerText = 'One last thing 💗';
  } 
  else {
    btn.style.display = 'none';
    endText.style.opacity = '1';
  }
});

/* ===== FLOATING HEARTS ===== */
const hearts = ['💗','💖','💕','💞'];
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'heart';
  h.innerText = hearts[Math.floor(Math.random() * hearts.length)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.animationDuration = (8 + Math.random() * 6) + 's';
  document.body.appendChild(h);

  setTimeout(() => {
    h.remove();
  }, 12000);
}, 900);
</script>

</body>
</html>
